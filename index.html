<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<style>
  .section-carrossel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    padding: 60px 225px;
    background-color: #fff;
    border-radius: 20px;
    overflow: hidden;
    max-width: 100%;
    box-sizing: border-box;
  }

  .section-carrossel .texto {
    flex: 1;
    max-width: 480px;
    transition: opacity 0.6s ease;
  }

  .section-carrossel h2 {
    color: #1b3b6f;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 15px;
  }

  .section-carrossel p {
    font-size: 16px;
    color: #333;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .section-carrossel .btn {
    display: inline-block;
    background-color: #1b3b6f;
    color: #fff;
    padding: 12px 40px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .section-carrossel .btn:hover {
    background-color: #2a7fa1;
    transform: scale(1.05);
  }

  /* Carrossel */
  .swiper {
    width: 420px;
    height: 500px;
    position: relative;
    overflow: hidden;
  }

  .swiper-slide {
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .swiper-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Efeito blur e scale nas não ativas */
  .swiper-slide:not(.swiper-slide-active) {
    filter: blur(4px);
    transform: scale(0.9);
    opacity: 0.7;
  }

  .swiper-button-next svg,
  .swiper-button-prev svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    color: #1b3b6f; /* Cor das setas */
    background: rgba(255,255,255,0.7); /* Fundo sutil para destaque */
    border-radius: 50%;
    padding: 10px;
  }

  /* Responsivo */
  @media (max-width: 991px) {
    .section-carrossel {
      flex-direction: column;
      text-align: center;
      gap: 40px;
      padding: 40px 20px;
    }

    .swiper {
      width: 90%;
      height: 400px;
    }

    .swiper-button-prev {
      left: 10px;
    }

    .swiper-button-next {
      right: 10px;
    }
  }
</style>

<div class="section-carrossel">
  
  <div class="texto" id="texto-carrossel">
    <h2 id="titulo-dinamico">ADMINISTRAÇÃO</h2>
    <p id="paragrafo-dinamico">
      Este é o modelo de parceria mais completo, onde a Nobile assume a gestão integral do seu hotel, visando a manutenção do patrimônio e a maximização da rentabilidade.
    </p>
    <a href="#" class="btn">CLIQUE PARA SABER MAIS</a>
  </div>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      
      <div class="swiper-slide">
        <img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Fachada-Hotel-Nobile-1.png" alt="Administração Nobile" />
      </div>

      <div class="swiper-slide">
        <img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Gemini_Generated_Image_lm473ylm473ylm47.png" alt="Franquia Nobile" />
      </div>

      <div class="swiper-slide">
        <img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Selo-Hotel-Nobile.png" alt="Associação Nobile" />
      </div>

      <div class="swiper-slide">
        <img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Quarto-Hotel-Nobile.png" alt="Licenciamento Nobile" />
      </div>
      
    </div>

    <div class="swiper-button-prev">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg>
    </div>
    <div class="swiper-button-next">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"></path></svg>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  // --- ÁREA DE EDIÇÃO DOS TEXTOS ---
  // Edite aqui os textos de cada slide. A ordem deve ser a mesma das imagens acima.
  const conteudos = [
    {
      titulo: "ADMINISTRAÇÃO",
      texto: "Este é o modelo de parceria mais completo, onde a Nobile assume a gestão integral do seu hotel, visando a manutenção do patrimônio e a maximização da rentabilidade."
    },
    {
      titulo: "FRANQUIA",
      texto: "Seu hotel operando sob os padrões e reconhecimento de uma marca consolidada. Ideal para quem busca padronização internacional mantendo a gestão local."
    },
    {
      titulo: "ASSOCIAÇÃO",
      texto: "Sua gestão independente com a <b>inteligência de vendas da Nobile</b>. Tenha acesso à força comercial e distribuição global sem mudar sua bandeira."
    },
    {
      titulo: "LICENCIAMENTO",
      texto: "Modelo focado em alavancar seu negócio através do uso da reputação da marca Nobile, agregando padrões de qualidade e acesso a canais de vendas exclusivos."
    }
  ];
  // ---------------------------------

  const swiper = new Swiper(".mySwiper", {
    loop: true,
    centeredSlides: true,
    slidesPerView: 1.2,
    spaceBetween: 20,
    grabCursor: true,
    autoplay: {
      delay: 7000,
      disableOnInteraction: false,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    on: {
      // Atualiza o texto quando o slide muda
      slideChange: function () {
        // Pega o índice real do slide (0, 1, 2 ou 3) ignorando os clones do loop
        const index = this.realIndex; 
        const conteudoAtual = conteudos[index];

        const textContainer = document.getElementById("texto-carrossel");
        const tituloEl = document.getElementById("titulo-dinamico");
        const paragrafoEl = document.getElementById("paragrafo-dinamico");

        // Efeito de sumir e aparecer (fade)
        textContainer.style.opacity = "0";

        setTimeout(() => {
          if(conteudoAtual) {
            tituloEl.innerText = conteudoAtual.titulo;
            // innerHTML permite usar negrito <b> no texto se quiser
            paragrafoEl.innerHTML = conteudoAtual.texto; 
          }
          textContainer.style.opacity = "1";
        }, 300);
      },
    },
    breakpoints: {
      992: {
        slidesPerView: 1.4,
      },
    },
  });
</script>
