<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<style>
  .section-carrossel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    padding: 60px 225px;
    background-color: #fff;
    border-radius: 20px;
    overflow: hidden;
    max-width: 100%;
    box-sizing: border-box;
    position: relative;
  }
  .section-carrossel .texto { flex: 1; max-width: 480px; transition: opacity 0.4s ease; }
  .section-carrossel h2 { color: #1b3b6f; font-size: 32px; font-weight: 800; margin-bottom: 15px; min-height: 40px; }
  .section-carrossel p { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.6; min-height: 80px; }
  
  .section-carrossel .btn {
    display: inline-block; background-color: #1b3b6f; color: #fff; padding: 12px 40px;
    border-radius: 8px; text-decoration: none; font-weight: 600; transition: 0.3s;
  }
  .section-carrossel .btn:hover { background-color: #2a7fa1; transform: scale(1.05); }

  .swiper { width: 420px; height: 500px; position: relative; padding-bottom: 40px; }
  .swiper-slide { border-radius: 20px; overflow: hidden; transition: all 0.4s ease; background: #fff; }
  .swiper-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .swiper-slide:not(.swiper-slide-active) { filter: blur(2px); transform: scale(0.9); opacity: 0.7; }
  
  /* --- CORREÇÃO DAS SETAS (PASSO 1) --- */
  
  /* 1. Mata a seta azul padrão gigante */
  .swiper-button-next::after, 
  .swiper-button-prev::after {
    content: "" !important;
    display: none !important;
  }

  /* 2. Estiliza a nossa setinha preta (SVG) */
  .swiper-button-next svg,
  .swiper-button-prev svg {
    width: 30px !important; /* Tamanho da seta */
    height: 30px !important;
    fill: #000000 !important; /* COR PRETA */
  }

  /* 3. Remove fundos e bordas */
  .swiper-button-prev,
  .swiper-button-next {
    background-color: transparent !important; /* Sem fundo branco */
    box-shadow: none !important;
    width: auto !important;
    height: auto !important;
  }
  /* ------------------------------------ */

  @media (max-width: 991px) {
    .section-carrossel { flex-direction: column; text-align: center; gap: 30px; padding: 40px 20px; }
    .section-carrossel .texto { max-width: 100%; }
    .section-carrossel h2, .section-carrossel p { min-height: auto; }
    .swiper { width: 100%; max-width: 350px; height: 400px; }
  }
</style>

<div class="section-carrossel">
  <div class="texto" id="caixa-texto">
    <h2 id="titulo-dinamico">Carregando...</h2>
    <p id="paragrafo-dinamico">Aguarde...</p>
    <a href="#" class="btn" id="btn-carrossel">CLIQUE PARA SABER MAIS</a>
  </div>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Fachada-Hotel-Nobile-1.png" alt="Administração"></div>
      <div class="swiper-slide"><img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Gemini_Generated_Image_lm473ylm473ylm47.png" alt="Franquia"></div>
      <div class="swiper-slide"><img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Selo-Hotel-Nobile.png" alt="Associação"></div>
      <div class="swiper-slide"><img src="https://www.nobilehoteis.com.br/landingpages/wp-content/uploads/2025/11/Quarto-Hotel-Nobile.png" alt="Licenciamento"></div>
    </div>
    
    <div class="swiper-button-prev">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg>
    </div>
    <div class="swiper-button-next">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"></path></svg>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  
  // --- CONFIGURAÇÃO: EDITE OS LINKS AQUI ---
  const dadosDoCarrossel = [
    {
      titulo: "ADMINISTRAÇÃO",
      texto: "Este é o modelo de parceria mais completo, onde a Nobile assume a gestão integral do seu hotel, visando a manutenção do patrimônio e a maximização da rentabilidade.",
      link: "https://www.nobilehoteis.com.br/contato/" 
    },
    {
      titulo: "FRANQUIA",
      texto: "Seu hotel operando sob os padrões e reconhecimento de uma marca consolidada. Ideal para quem busca padronização internacional mantendo a gestão local.",
      link: "https://www.nobilehoteis.com.br/marcas/" 
    },
    {
      titulo: "ASSOCIAÇÃO",
      texto: "Sua gestão independente com a <b>inteligência de vendas da Nobile</b>. Tenha acesso à força comercial e distribuição global sem mudar sua bandeira.",
      link: "https://www.nobilehoteis.com.br/nobile-plus/" 
    },
    {
      titulo: "LICENCIAMENTO",
      texto: "Modelo focado em alavancar seu negócio através do uso da reputação da marca Nobile, agregando padrões de qualidade e acesso a canais de vendas exclusivos.",
      link: "https://www.nobilehoteis.com.br/investidores/" 
    }
  ];

  const tituloEl = document.getElementById("titulo-dinamico");
  const textoEl = document.getElementById("paragrafo-dinamico");
  const btnEl = document.getElementById("btn-carrossel");
  const caixaEl = document.getElementById("caixa-texto");

  new Swiper(".mySwiper", {
    loop: true, centeredSlides: true, slidesPerView: 1.2, spaceBetween: 20, grabCursor: true,
    autoplay: { delay: 5000, disableOnInteraction: false },
    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
    breakpoints: { 992: { slidesPerView: 1.4 } },
    on: {
      slideChange: function () {
        const index = this.realIndex;
        caixaEl.style.opacity = "0";
        setTimeout(() => {
          if (dadosDoCarrossel[index]) {
            tituloEl.innerText = dadosDoCarrossel[index].titulo;
            textoEl.innerHTML = dadosDoCarrossel[index].texto;
            btnEl.href = dadosDoCarrossel[index].link; 
          }
          caixaEl.style.opacity = "1";
        }, 300);
      }
    }
  });
});
</script>
